<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:Arial,sans-serif;color:#111;background:#fff;margin:0;padding:16px;line-height:1.5}a{color:#1c4fb0}img{max-width:100%}</style><title>Northwind - Contact</title></head>
<body>
<header><nav aria-label="Main"><ul><li><a href="/">Home</a></li><li><a href="/contact">Contact</a></li></ul></nav></header>
<main>
  <h1>Contact us</h1>
  <p>Our support team replies within one working day.</p>
  <img src="assets/logo.svg" alt="Northwind Traders logo" width="160" height="48">
  <form action="#" onsubmit="return false">
    <p><label for="name">Full name</label><br><input id="name" type="text" autocomplete="name"></p>
    <p><label for="msg">Message</label><br><textarea id="msg" rows="4"></textarea></p>
    <button type="submit">Send message</button>
  </form>
</main>
<footer><p>Northwind Traders</p></footer>
</body></html>
