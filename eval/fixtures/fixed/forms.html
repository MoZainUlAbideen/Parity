<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:Arial,sans-serif;color:#111;background:#fff;margin:0;padding:16px;line-height:1.5}a{color:#1c4fb0}img{max-width:100%}</style><title>Northwind - Sign up (fixed)</title></head>
<body>
<header><p>Northwind Traders</p></header>
<main>
  <h1>Create your account</h1>
  <form action="#" onsubmit="return false">
    <p><label for="email">Email</label><br><input id="email" type="email" autocomplete="email"></p>
    <p><label for="phone">Phone number</label><br><input id="phone" type="tel" autocomplete="tel"></p>
    <p><label for="country">Country</label><br><select id="country"><option>Pakistan</option><option>Germany</option><option>Canada</option></select></p>
    <button id="submit-btn" type="submit">Create account</button>
  </form>
</main>
<footer><p>Northwind Traders</p></footer>
</body></html>
