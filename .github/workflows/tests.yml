name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest -q

      - name: Baseline eval
        run: uv run parity baseline-eval
